# =========================================================
# tmux — stock keybindings, plain grey status line
#
# Deliberately boring. Every default binding is left exactly as tmux
# ships it, so the muscle memory you build here also works on a vanilla
# tmux you ssh into. Prefix is C-b. Nothing is remapped.
#
# Two intentional deviations, both of which cost no muscle memory:
#   1. windows and panes are numbered from 1 instead of 0
#   2. `prefix R` reloads this file (R is unbound in stock tmux)
#
# Everything else here is appearance, scrollback and latency — never
# key bindings. Key reference: command-cheatsheets/tmux.md
#
# Requires tmux >= 3.2 (%hidden, pane-border-lines).
# =========================================================


# --- Terminal --------------------------------------------
set -g default-terminal "tmux-256color"
# Tc declares truecolour support per outside-TERM. Ghostty sets
# TERM=xterm-ghostty, which matches neither *256col* nor alacritty, so
# without naming it here everything inside tmux silently drops to 256
# colours — most visible as banded, slightly-wrong theme colours in
# nvim.
set -ga terminal-overrides ",*256col*:Tc,alacritty:Tc,xterm-ghostty:Tc"

# Default escape-time is 500ms, which makes <Esc> in Neovim feel broken.
set -s escape-time 10

set -g focus-events on          # let Neovim see FocusGained/FocusLost
set -g history-limit 50000
set -g mouse on
set -g display-time 2000        # keep messages up long enough to read
set -g set-titles on
set -g set-titles-string "#S: #W"


# --- Numbering -------------------------------------------
# Count from 1. The number row starts at 1 and `prefix 0` is a reach, so
# this is the one default worth breaking.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on      # no gaps after closing a window

# Name each window after its working directory's basename, so the #W in
# the status line says `nvim-config` instead of `zsh`. Overridden the
# moment you name a window yourself with `prefix ,`.
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"


# --- Palette ---------------------------------------------
# No theme. Two greys on the terminal's own background: DIM for
# everything, BRIGHT for the one thing you're looking at.
#
# This is deliberately NOT wired into the ~/.config/theme switcher
# that drives zsh, nvim, ghostty and delta. Two reasons:
#
#   1. colour243/252 are palette *indices*, not hex, so they already
#      track whatever theme the terminal is on, for free.
#   2. every style below uses bg=default, so the status line inherits
#      the terminal background rather than painting its own. That is
#      what keeps Ghostty's blur visible behind the status line
#      instead of an opaque bar across the bottom of the glass.
#
# Adding per-theme colours here would break both properties.
%hidden DIM="colour243"
%hidden BRIGHT="colour252"


# --- Status line -----------------------------------------
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=$DIM"

# Nothing on the left. The session name lived here, which is why an
# unnamed session showed a bare `0`.
set -g status-left ""

# Windows: index:name, current one brighter. #{window_flags} is the
# zoom/activity/bell marker; the ?: keeps the width stable without one.
set -g window-status-separator ""
setw -g window-status-format "#[fg=$DIM] #I:#W#{?window_flags,#{window_flags}, } "
setw -g window-status-current-format "#[fg=$BRIGHT,bold] #I:#W#{?window_flags,#{window_flags}, } "
setw -g window-status-activity-style "fg=$BRIGHT"

# Right: `^B` while the prefix is held — saves a lot of "did that
# register?" guessing — then host and clock.
set -g status-right-length 50
set -g status-right "#{?client_prefix,^B ,}#h %H:%M "


# --- Panes -----------------------------------------------
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=$DIM"
set -g pane-border-lines single
set -g display-panes-time 2000


# --- Copy mode & messages --------------------------------
# mode-keys is left unset on purpose. tmux picks emacs, or vi when
# $EDITOR/$VISUAL looks vi-ish — the same thing it will do on a server.
set -g mode-style "bg=$DIM,fg=black"
set -g message-style "bg=default,fg=$BRIGHT"
set -g message-command-style "bg=default,fg=$BRIGHT"


# --- Quiet -----------------------------------------------
# Mark activity in the status line; never ring, flash or interrupt.
setw -g monitor-activity on
set -g visual-activity off
set -g visual-bell off
set -g bell-action none


# --- The one added binding -------------------------------
# R is unbound in stock tmux, so this displaces nothing.
bind R source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
