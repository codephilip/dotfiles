prSections:
    - title: My Pull Requests
      filters: is:open author:@me
    - title: Needs My Review
      filters: is:open review-requested:@me
    - title: Involved
      filters: is:open involves:@me -author:@me
issuesSections:
    - title: My Issues
      filters: is:open author:@me
    - title: Assigned
      filters: is:open assignee:@me
    - title: Involved
      filters: is:open involves:@me -author:@me
notificationsSections:
    - title: All
      filters: ""
    - title: Created
      filters: reason:author
    - title: Participating
      filters: reason:participating
    - title: Mentioned
      filters: reason:mention
    - title: Review Requested
      filters: reason:review-requested
    - title: Assigned
      filters: reason:assign
    - title: Subscribed
      filters: reason:subscribed
    - title: Team Mentioned
      filters: reason:team-mention
repo:
    branchesRefetchIntervalSeconds: 30
    prsRefetchIntervalSeconds: 60
defaults:
    preview:
        open: true
        width: 0.45
        height: 0.6
        position: auto
    prsLimit: 20
    prApproveComment: LGTM
    issuesLimit: 20
    notificationsLimit: 20
    view: prs
    layout:
        prs:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 20
            author:
                width: 15
            authorIcon:
                hidden: false
            labels:
                width: 22
                hidden: true
            assignees:
                width: 20
                hidden: true
            base:
                width: 15
                hidden: true
            lines:
                width: 15
        issues:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 15
            creator:
                width: 10
            creatorIcon:
                hidden: false
            assignees:
                width: 20
                hidden: true
    refetchIntervalMinutes: 30
keybindings:
    prs:
        # All three check the PR out detached in the review worktree
        # (repoPaths below), in a new tmux window when inside tmux.
        - key: N
          name: review in nvim (diffview)
          command: ~/.config/gh-dash/review-pr.sh {{.RepoPath}} {{.PrNumber}} {{.BaseRefName}} diff
        - key: O
          name: review in nvim (octo, inline comments)
          command: ~/.config/gh-dash/review-pr.sh {{.RepoPath}} {{.PrNumber}} {{.BaseRefName}} octo
        - key: L
          name: review in lazygit
          command: ~/.config/gh-dash/review-pr.sh {{.RepoPath}} {{.PrNumber}} {{.BaseRefName}} lazygit
repoPaths:
    # A dedicated review worktree, not the working clone. Recreate with:
    #   git -C ~/quizos/quizos worktree add --detach ~/quizos/quizos-review origin/main
    quantdesigns/quizos: ~/quizos/quizos-review
theme:
    ui:
        sectionsShowCount: true
        table:
            showSeparator: true
            compact: false
pager:
    diff: delta
confirmQuit: false
showAuthorIcons: true
smartFilteringAtLaunch: true
includeReadNotifications: true
