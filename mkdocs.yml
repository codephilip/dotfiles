site_name: phil's dotfiles
site_description: Neovim, zsh and terminal configuration — a working reference
site_author: codephil
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: en
  icon:
    logo: material/console
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  features:
    # Navigation
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking      # URL updates as you scroll
    - navigation.sections
    - navigation.indexes       # a section can have its own landing page
    - navigation.top           # back-to-top button
    - navigation.footer        # prev/next links
    - toc.follow
    # Search
    - search.suggest
    - search.highlight
    - search.share
    # Content
    - content.code.copy        # copy button on every code block
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

  palette:
    # Light — Tokyo Night Day
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark — Tokyo Night
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/tokyonight.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: "¶"
      permalink_title: Link to this section
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  # NOTE: no mermaid custom_fence. Material's mermaid integration loads the
  # library from a CDN at view time; it was verified to render empty divs here
  # and breaks offline entirely. Diagrams are plain HTML + CSS instead — see
  # the .dg classes in stylesheets/tokyonight.css.
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  # Renders ++ctrl+r++ as real keyboard keys — used heavily in the key tables
  - pymdownx.keys
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang: en

nav:
  - Home: index.md
  - Neovim:
      - neovim/index.md
      - Architecture: neovim/architecture.md
      - Plugins: neovim/plugins.md
      - Key bindings: neovim/keybindings.md
      - AI workflow: neovim/ai.md
  - Shell:
      - shell/index.md
      - Key bindings: shell/keybindings.md
  - Terminal: terminal.md
  - Theming: theming.md
  - Git: git.md
  - Troubleshooting: troubleshooting.md

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/codephil
      name: GitHub
