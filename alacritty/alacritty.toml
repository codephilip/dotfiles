# =========================================================
# Alacritty — fallback terminal
#
# Ghostty is the daily driver (see ghostty/config); Alacritty is kept
# because it is the one that works everywhere, including over X
# forwarding and on Linux. It is styled to match Ghostty -- same
# palette, glass, padding, font and cursor -- so switching between the
# two is not a visual jump. Keep the two in step when changing either.
#
# Colours are NOT defined here. theme-current.toml is GENERATED from
# theme/palettes/<name>.sh by scripts/theme — switch with:
#
#     theme solarized-osaka
#
# Alacritty live-reloads this file, so a switch applies to open
# windows with no restart.
# =========================================================

# `import` lives under [general] as of Alacritty 0.14; this is 0.16.
# Paths are relative to the config file.
[general]
# local.toml is per-machine and gitignored (missing imports are skipped);
# scripts/windows-setup writes one that launches MSYS2 zsh.
import = [
  "~/.config/alacritty/theme-current.toml",
  "~/.config/alacritty/local.toml",
]
live_config_reload = true

# =========================
# WINDOW
# =========================
[window]
padding = { x = 14, y = 12 }
dynamic_padding = false
decorations = "buttonless"
startup_mode = "Windowed"

# The glass, matching Ghostty's background-opacity = 0.86 and
# background-blur = 20. Older Alacritty had no blur on macOS and
# composited the raw desktop behind the text, which is why this used to
# sit at a muddier-but-readable 0.92; 0.16 (installed here) blurs. opacity and blur
# are a pair: blur does nothing at 1.0.
#
# What Alacritty cannot do is Ghostty's macos-glass-* material (see
# ghostty/local.conf on macOS 26+ machines). This is the plain
# gaussian blur, the same look as Ghostty's portable shared setting.
opacity = 0.86
blur = true

# Left Option is Alt, so zsh's Alt-C / Alt-B / Alt-. work; right
# Option still types accented characters. Same as Ghostty's
# macos-option-as-alt = left.
option_as_alt = "OnlyLeft"

# =========================
# FONT
# =========================
[font]
size = 13.5

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.offset]
x = 0
y = 1

[font.glyph_offset]
x = 0
y = 0

# =========================
# CURSOR
# =========================
[cursor]
blink_interval = 500
thickness = 0.18

[cursor.style]
shape = "Beam"
blinking = "On"

# =========================
# SCROLLING
# =========================
[scrolling]
# Alacritty's ceiling. Ghostty's limit is in bytes and set far higher,
# but 100k lines is more than you'll scroll by hand.
history = 100000
multiplier = 3

# =========================
# SELECTION
# =========================
[selection]
save_to_clipboard = true

# =========================
# MOUSE
# =========================
# Matches Ghostty's mouse-hide-while-typing.
[mouse]
hide_when_typing = true

# =========================
# KEYBOARD
# =========================
# Shift+Enter sends ESC CR — a literal newline instead of submitting.
# Needed by Claude Code and most REPLs. Ghostty's equivalent is
# `keybind = shift+enter=text:\x1b\r`.
[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
