# =========================================================
# tmux — minimal, stable, remote-friendly
# =========================================================

##### CORE #####
set -g default-terminal "tmux-256color"
set -g mouse on
set -g history-limit 50000
set -sg escape-time 5
set -g focus-events on

##### PREFIX #####
unbind C-b
set -g prefix C-a
bind C-a send-prefix

##### INDEXING #####
# Window and pane numbers start at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

##### SPLITS #####
unbind '"'
unbind %
bind | split-window -h
bind - split-window -v

##### NAVIGATION (vim-style) #####
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

##### COPY MODE #####
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection

##### STATUS BAR #####
set -g status on
set -g status-interval 5
set -g status-position bottom

# Colors (subtle hacker palette)
set -g status-style bg=default,fg=colour245
set -g message-style bg=default,fg=colour81

##### LEFT — SESSION + HOST CONTEXT #####
# Shows session name always
# Shows hostname only when SSH'd
set -g status-left-length 40
set -g status-left "#[fg=colour81,bold] #S#{?client_ssh,#[fg=colour238]@#H,} "

##### WINDOWS #####
# Clean, readable, numbered
setw -g window-status-style fg=colour244
setw -g window-status-current-style fg=colour81,bold

setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #[fg=colour81,bold]#I:#W "

##### RIGHT — DATE / TIME #####
set -g status-right-length 40
set -g status-right "#[fg=colour244]%Y-%m-%d #[fg=colour81]%H:%M "

##### PANE BORDERS #####
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour81

##### SILENCE #####
set -g visual-bell off
set -g visual-activity off
set -g bell-action none

##### QUALITY OF LIFE #####
# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"

# Detach quickly
bind q detach
