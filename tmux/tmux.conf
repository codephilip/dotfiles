# =========================================================
# tmux — stock keybindings, Tokyo Night status line
#
# Deliberately boring. Every default binding is left exactly as tmux
# ships it, so the muscle memory you build here also works on a vanilla
# tmux you ssh into. Prefix is C-b. Nothing is remapped.
#
# Two intentional deviations, both of which cost no muscle memory:
#   1. windows and panes are numbered from 1 instead of 0
#   2. `prefix R` reloads this file (R is unbound in stock tmux)
#
# Everything else here is appearance, scrollback and latency — never
# key bindings. Key reference: command-cheatsheets/tmux.md
#
# Requires tmux >= 3.2 (%hidden, pane-border-lines).
# =========================================================


# --- Terminal --------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,alacritty:Tc"

# Default escape-time is 500ms, which makes <Esc> in Neovim feel broken.
set -s escape-time 10

set -g focus-events on          # let Neovim see FocusGained/FocusLost
set -g history-limit 50000
set -g mouse on
set -g display-time 2000        # keep messages up long enough to read
set -g set-titles on
set -g set-titles-string "#S: #W"


# --- Numbering -------------------------------------------
# Count from 1. The number row starts at 1 and `prefix 0` is a reach, so
# this is the one default worth breaking.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on      # no gaps after closing a window

# Name each window after its working directory's basename, so the #W in
# the status line says `nvim-config` instead of `zsh`. Overridden the
# moment you name a window yourself with `prefix ,`.
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"


# --- Palette ---------------------------------------------
# Tokyo Night, matching alacritty/alacritty.toml and starship.toml.
%hidden BG="#1a1b26"
%hidden FG="#c0caf5"
%hidden GREY="#565f89"
%hidden BLUE="#7aa2f7"
%hidden ORANGE="#ff9e64"
%hidden BORDER="#2f334d"


# --- Status line -----------------------------------------
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=$BG,fg=$GREY"

# Left: session name. Turns orange while the prefix is held, which saves
# a lot of "did that register?" guessing.
set -g status-left-length 30
set -g status-left "#[fg=$BG,bg=#{?client_prefix,$ORANGE,$BLUE},bold] #S #[default] "

# Windows: index:name, current one picked out. #{window_flags} is the
# zoom/activity/bell marker; the ?: keeps the width stable without one.
set -g window-status-separator ""
setw -g window-status-format "#[fg=$GREY,bg=$BG] #I:#W#{?window_flags,#{window_flags}, } "
setw -g window-status-current-format "#[fg=$BLUE,bg=$BG,bold] #I:#W#{?window_flags,#{window_flags}, } "
setw -g window-status-activity-style "fg=$ORANGE,bg=$BG"

# Right: host, then clock. The host is the point of the whole thing once
# you have three sessions open on three different machines.
set -g status-right-length 50
set -g status-right "#[fg=$GREY]#h #[fg=$FG]%H:%M "


# --- Panes -----------------------------------------------
set -g pane-border-style "fg=$BORDER"
set -g pane-active-border-style "fg=$BLUE"
set -g pane-border-lines single
set -g display-panes-time 2000


# --- Copy mode & messages --------------------------------
# mode-keys is left unset on purpose. tmux picks emacs, or vi when
# $EDITOR/$VISUAL looks vi-ish — the same thing it will do on a server.
set -g mode-style "bg=$BLUE,fg=$BG"
set -g message-style "bg=$BLUE,fg=$BG,bold"
set -g message-command-style "bg=#15161e,fg=$FG"


# --- Quiet -----------------------------------------------
# Mark activity in the status line; never ring, flash or interrupt.
setw -g monitor-activity on
set -g visual-activity off
set -g visual-bell off
set -g bell-action none


# --- The one added binding -------------------------------
# R is unbound in stock tmux, so this displaces nothing.
bind R source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
